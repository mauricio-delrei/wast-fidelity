spring:

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver


  jpa:

    database-platform:
      org.hibernate.dialect.PostgreSQLDialect

    open-in-view:
      false

    hibernate:
      ddl-auto: validate


  flyway:

    enabled:
      true

    baseline-on-migrate:
      true


  data:

    redis:

      host:
        ${SPRING_REDIS_HOST}

      port:
        ${SPRING_REDIS_PORT}



logging:

  level:

    org.hibernate.SQL:
      INFO